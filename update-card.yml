name: Update Profile Card

on:
  schedule:
    - cron: "0 */12 * * *"   # refresh stats every 12 hours
  workflow_dispatch:          # allow manual runs
  push:
    paths:
      - build_card.py
      - portrait_*.txt
      - portrait_meta.json

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Build the card with live GitHub stats
        run: python3 build_card.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit updated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg
          git diff --staged --quiet || git commit -m "Update profile card"
          git push
